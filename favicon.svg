<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tile" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#C4572A" />
      <stop offset="1" stop-color="#9E4520" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- rust-gradient tile, sharp corners (knolling) -->
  <rect width="64" height="64" rx="0" fill="url(#tile)" />
  <!-- soft top sheen -->
  <rect width="64" height="64" rx="0" fill="url(#sheen)" />
  <!-- faint inner hairline for definition on light tabs -->
  <rect x="1" y="1" width="62" height="62" rx="0" fill="none"
        stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.4" />

  <!-- </> code mark, matching the site's line-icon style -->
  <g fill="none" stroke="#FAFAF8" stroke-width="4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 21 L14 32 L24 43" />
    <path d="M40 21 L50 32 L40 43" />
    <path d="M35 18 L29 46" />
  </g>
</svg>
